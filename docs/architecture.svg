<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510" role="img" aria-labelledby="title desc">
<title id="title">TourneyLab architecture</title><desc id="desc">The renderer and chess engine communicate with Electron main through a preload IPC bridge. Main writes local files and optionally calls a Cloudflare Worker backed by D1, R2, Google and Stripe.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#68717d"/></marker></defs>
<rect width="1000" height="510" fill="#fff"/>
<g font-family="Arial,sans-serif" fill="#20252c"><text x="30" y="36" font-size="20" font-weight="700">Desktop application</text><text x="640" y="36" font-size="20" font-weight="700">Optional publishing service</text></g>
<g fill="#f6f8fa" stroke="#cbd2da"><rect x="30" y="60" width="265" height="110" rx="8"/><rect x="325" y="60" width="255" height="110" rx="8"/><rect x="30" y="225" width="265" height="75" rx="8"/><rect x="30" y="355" width="265" height="100" rx="8"/><rect x="325" y="355" width="255" height="100" rx="8"/></g>
<g fill="#eef5f1" stroke="#aec6b8"><rect x="640" y="355" width="330" height="100" rx="8"/><rect x="640" y="60" width="150" height="100" rx="8"/><rect x="820" y="60" width="150" height="100" rx="8"/><rect x="640" y="215" width="150" height="80" rx="8"/><rect x="820" y="215" width="150" height="80" rx="8"/></g>
<g font-family="Arial,sans-serif" fill="#20252c" font-size="16"><g font-weight="700"><text x="50" y="91">Renderer</text><text x="345" y="91">Chess engine</text><text x="50" y="254">Preload bridge / IPC</text><text x="50" y="386">Electron main</text><text x="345" y="386">Local files</text><text x="660" y="386">Cloudflare Worker API</text><text x="660" y="91">D1</text><text x="840" y="91">R2</text><text x="660" y="245">Google</text><text x="840" y="245">Stripe</text></g><g font-size="14" fill="#535d69"><text x="50" y="119">UI, store, report generation</text><text x="50" y="145">Events → sections → rounds</text><text x="345" y="119">Pairings, results, standings</text><text x="345" y="145">Plain ES modules</text><text x="50" y="279">Named desktop operations</text><text x="50" y="414">Persistence, exports, credentials</text><text x="50" y="438">Publishing client</text><text x="345" y="414">Workspace JSON, .tlab, backups</text><text x="345" y="438">Reports and report bundles</text><text x="660" y="414">Authentication, entitlements, publishing</text><text x="660" y="438">Public report delivery</text><text x="660" y="119">Accounts and</text><text x="660" y="141">report metadata</text><text x="840" y="119">Versioned</text><text x="840" y="141">report content</text><text x="660" y="274">Sign-in</text><text x="840" y="274">Billing</text></g></g>
